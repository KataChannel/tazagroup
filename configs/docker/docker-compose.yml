  postgres:
    image: postgres:15-alpine
    container_name: katadev-postgres
    restart: ${RESTART_POLICY:-unless-stopped}
    ports:
      - "5444:5444"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    networks:
      - katadev-network
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: katadev-redis
    restart: ${RESTART_POLICY:-unless-stopped}
    ports:
      - "6400:6400"
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    networks:
      - katadev-network
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  minio:
    image: minio/minio:latest
    container_name: katadev-minio
    restart: ${RESTART_POLICY}
    ports:
      - "${MINIO_PORT}:9110"
      - "${MINIO_CONSOLE_PORT}:9111"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9111"
    networks:
      - katadev-network
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9110/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: katadev-pgadmin
    restart: ${RESTART_POLICY}
    ports:
      - "${PGADMIN_PORT}:5555"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    networks:
      - katadev-network
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5555/misc/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  katadev-network:
    driver: bridge
    name: katadev-network

volumes:
  postgres_data:
    name: katadev-postgres-data
  redis_data:
    name: katadev-redis-data
  minio_data:
    name: katadev-minio-data
  pgadmin_data:
    name: katadev-pgadmin-data
  api_logs:
    name: katadev-api-logs
