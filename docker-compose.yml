version: '3.8'

# TazaGroup Single Domain Deployment
# Optimized for production deployment
# Note: PostgreSQL, Redis, and MinIO are already running on the host server

services:
  # ========================================
  # Backend API
  # ========================================
  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    container_name: tazagroup-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 4000
    ports:
      - "13001:4000"
    network_mode: host
    deploy:
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 512M

  # ========================================
  # Frontend Application
  # ========================================
  frontend:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile.tazagroup
    container_name: tazagroup-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_OTEL_ENABLED: "false"
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_APP_URL: http://116.118.49.243:13000
      NEXT_PUBLIC_GRAPHQL_ENDPOINT: https://appapi.tazagroup.vn/graphql
    ports:
      - "13000:3000"
    depends_on:
      - backend
    network_mode: host
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
