version: '3.8'

# TazaGroup Domain Deployment - Optimized for Production
# Uses shared Redis & Minio from hybrid setup
# Dedicated PostgreSQL for TazaGroup

services:
  # ========================================
  # SHARED SERVICES (Redis & Minio)
  # Already running from hybrid setup - managed separately
  # ========================================
  
  # Redis Cache - Shared service (port 12004)
  redis:
    image: redis:7.4-alpine
    container_name: shared-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --timeout 300 --maxmemory 128mb --maxmemory-policy allkeys-lru
    ports:
      - "12004:6379"
    volumes:
      - redis_data:/data
    networks:
      - tazagroup-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M

  # Minio Object Storage - Shared service (port 12007)
  minio:
    image: minio/minio:RELEASE.2024-08-26T15-33-07Z
    container_name: shared-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minio-admin
      MINIO_ROOT_PASSWORD: minio-secret-2025
    ports:
      - "12007:9000"
      - "12008:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - tazagroup-network
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M

  # ========================================
  # TAZAGROUP DOMAIN (Port 13xxx) - Dedicated Stack
  # ========================================
  
  # PostgreSQL for TazaGroup - Dedicated
  postgres:
    image: postgres:16-alpine
    container_name: tazagroup-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: tazagroupcore
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "13003:5432"
    volumes:
      - tazagroup_postgres_data:/var/lib/postgresql/data
    networks:
      - tazagroup-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  # Backend API for TazaGroup
  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
      no_cache: true
    container_name: tazagroup-backend
    restart: unless-stopped
    ports:
      - "13001:13001"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 13001
      # Connect to host services
      DATABASE_URL: postgresql://postgres:postgres@116.118.49.243:13003/tazagroupcore
      REDIS_HOST: 116.118.49.243
      REDIS_PORT: 12004
      MINIO_INTERNAL_ENDPOINT: 116.118.49.243
      MINIO_INTERNAL_PORT: 12007
      MINIO_ENDPOINT: storage.tazagroup.vn
      MINIO_PORT: 443
      MINIO_USE_SSL: "false"
      MINIO_FORCE_HTTPS: "true"
      # Public endpoints
      FRONTEND_URL: https://app.tazagroup.vn
      NEXT_PUBLIC_APP_URL: https://app.tazagroup.vn
      NEXT_PUBLIC_GRAPHQL_ENDPOINT: https://appapi.tazagroup.vn/graphql
    networks:
      - tazagroup-network
    depends_on:
      - postgres
      - redis
      - minio
    deploy:
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 512M
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:13001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend Application for TazaGroup
  frontend:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile
      no_cache: true
    container_name: tazagroup-frontend
    restart: unless-stopped
    ports:
      - "13000:13000"
    environment:
      NODE_ENV: production
      PORT: 13000
      NEXT_OTEL_ENABLED: "false"
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_APP_URL: https://app.tazagroup.vn
      NEXT_PUBLIC_GRAPHQL_ENDPOINT: https://appapi.tazagroup.vn/graphql
      NEXTAUTH_URL: https://app.tazagroup.vn
    networks:
      - tazagroup-network
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:13000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  tazagroup_postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local

networks:
  tazagroup-network:
    driver: bridge
    name: tazagroup-network
